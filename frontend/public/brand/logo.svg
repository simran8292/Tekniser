<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2.5" dy="3" stdDeviation="1.5" flood-color="#1e293b" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="logo-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46baa9" />
      <stop offset="100%" stop-color="#2ca694" />
    </linearGradient>
  </defs>
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="64" 
    fill="url(#logo-teal-grad)" 
    letter-spacing="7" 
    filter="url(#logo-shadow)">
    TAKNISER
  </text>
</svg>
